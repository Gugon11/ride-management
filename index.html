<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Boleias</title>
<link rel="icon" type="image/x-icon" href="Boleias.ico">
<link rel="manifest" href="icons_and_manifest/manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="icons_and_manifest/icons/boleias-192x192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <header>
    <div>
      <div class="logo">Bolei<span>as</span></div>
      <div class="tagline">Gestão de Viagens</div>
    </div>
    <div class="date-badge" id="dateBadge">—</div>
  </header>

  <!-- SECÇÃO: COMBUSTÍVEL -->
  <div class="section-label">Combustível</div>
  <div class="card">
    <div class="grid-3">
      <div class="field">
        <label for="selComb">Tipo</label>
        <select id="selComb">
          <option value="">— carregar —</option>
        </select>
      </div>
      <div class="field">
        <label for="selDistrito">Distrito</label>
        <select id="selDistrito" disabled>
          <option value="">— escolhe combustível —</option>
        </select>
      </div>
      <div class="field">
        <label for="selMunicipio">Município</label>
        <select id="selMunicipio" disabled>
          <option value="">— escolhe distrito —</option>
        </select>
      </div>
    </div>

    <div class="grid-2" style="margin-top:12px">
      <div class="field">
        <label for="selMarca">Marca</label>
        <select id="selMarca" disabled>
          <option value="">Todas</option>
        </select>
      </div>
      <div class="field">
        <label for="selPosto">Posto</label>
        <select id="selPosto" disabled>
          <option value="">— escolhe município —</option>
        </select>
      </div>
    </div>

    <div class="price-row">
      <div class="price-box">
        <div class="lbl">Preço Combustível</div>
        <div class="val" id="precoValor">—</div>
        <div class="sub" id="precoData"></div>
      </div>
      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-accent" id="btnAtualizarPreco">Atualizar Preço</button>
        <span class="status" id="precoStatus"></span>
      </div>
    </div>
  </div>

  <!-- SECÇÃO: PARÂMETROS -->
  <div class="section-label mt">Parâmetros</div>
  <div class="card">
    <div class="grid-km">
      <div class="field">
        <label for="kmViagem">Km Viagem (total)</label>
        <input type="number" id="kmViagem" value="100" min="1">
      </div>
      <div class="field">
        <label for="consumoCarro">Consumo (L/100km)</label>
        <input type="number" id="consumoCarro" value="5.5" step="0.1" min="0.1">
      </div>
      <div class="price-box" style="min-width:unset;">
        <div class="lbl">Custo por sentido</div>
        <div class="val" id="custoPorSentido">—</div>
      </div>
    </div>
  </div>

  <!-- SECÇÃO: PESSOAS -->
  <div class="section-label mt">Pessoas</div>
  <div class="card">
    <div class="pessoa-add">
      <input type="text" id="inputPessoa" placeholder="Nome (ex.: Ana)" maxlength="40" autocomplete="off">
      <button class="btn btn-accent" id="btnAddPessoa">Adicionar</button>
    </div>
    <div class="chips" id="pessoasChips"></div>
    <div class="hint">Adiciona aqui os nomes uma vez — depois basta tocar nos nomes em cada dia.</div>
  </div>

  <!-- SECÇÃO: SEMANA -->
  <div class="section-label mt">Semana</div>
  <div class="week-grid" id="weekGrid"></div>

  <!-- TOTAIS -->
  <div class="totals-card">
    <div class="section-label" style="margin-bottom:0">Total Semana</div>
    <div class="totals-grid" id="totaisGrid">
      <div class="status">Preenche a semana para ver os totais.</div>
    </div>
  </div>

  <!-- ACÇÕES -->
  <div class="btn-row" style="margin-top:20px">
    <button class="btn btn-ghost" id="btnLimparSemana">Limpar Semana</button>
    <button class="btn btn-ghost" id="btnCopiarResumo">Copiar Resumo</button>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
